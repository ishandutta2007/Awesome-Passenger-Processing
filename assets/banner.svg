<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 350" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b132b" />
      <stop offset="50%" stop-color="#1c2541" />
      <stop offset="100%" stop-color="#3a506b" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4cc9f0" />
      <stop offset="50%" stop-color="#4895ef" />
      <stop offset="100%" stop-color="#4361ee" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      .title { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 800; font-size: 52px; fill: #ffffff; }
      .subtitle { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 500; font-size: 22px; fill: #4cc9f0; letter-spacing: 2px; }
      .tag { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-size: 16px; fill: #e0e1dd; }
      
      @keyframes radarSweep {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes pulse {
        0%, 100% { opacity: 0.3; transform: scale(1); }
        50% { opacity: 0.9; transform: scale(1.05); }
      }
      @keyframes floatPlane {
        0% { transform: translate(0px, 0px); }
        50% { transform: translate(15px, -10px); }
        100% { transform: translate(0px, 0px); }
      }
      @keyframes scanline {
        0% { transform: translateY(0px); opacity: 0.2; }
        50% { opacity: 0.8; }
        100% { transform: translateY(350px); opacity: 0.2; }
      }

      .radar-sweep { transform-origin: 1000px 175px; animation: radarSweep 8s linear infinite; }
      .pulse-circle { transform-origin: 1000px 175px; animation: pulse 3s ease-in-out infinite; }
      .plane-anim { animation: floatPlane 4s ease-in-out infinite; }
      .scanline-anim { animation: scanline 4s linear infinite; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="350" rx="16" fill="url(#bgGrad)" />

  <!-- Grid overlay -->
  <g stroke="#ffffff" stroke-opacity="0.05" stroke-width="1">
    <line x1="0" y1="70" x2="1200" y2="70" />
    <line x1="0" y1="140" x2="1200" y2="140" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="280" x2="1200" y2="280" />
    <line x1="200" y1="0" x2="200" y2="350" />
    <line x1="400" y1="0" x2="400" y2="350" />
    <line x1="600" y1="0" x2="600" y2="350" />
    <line x1="800" y1="0" x2="800" y2="350" />
    <line x1="1000" y1="0" x2="1000" y2="350" />
  </g>

  <!-- Animated Radar Graphic -->
  <g transform="translate(0, 0)">
    <circle cx="1000" cy="175" r="110" fill="none" stroke="#4cc9f0" stroke-width="1.5" stroke-opacity="0.3" class="pulse-circle" />
    <circle cx="1000" cy="175" r="80" fill="none" stroke="#4895ef" stroke-width="1" stroke-opacity="0.4" />
    <circle cx="1000" cy="175" r="50" fill="none" stroke="#4361ee" stroke-width="1" stroke-opacity="0.5" />
    <circle cx="1000" cy="175" r="5" fill="#4cc9f0" filter="url(#glow)" />
    
    <!-- Sweep line -->
    <line x1="1000" y1="175" x2="1110" y2="175" stroke="#4cc9f0" stroke-width="2.5" class="radar-sweep" filter="url(#glow)" />
    
    <!-- Biometric Target Dots -->
    <circle cx="960" cy="140" r="4" fill="#7209b7" filter="url(#glow)" />
    <circle cx="1030" cy="210" r="4" fill="#4cc9f0" filter="url(#glow)" />
    <circle cx="1040" cy="130" r="3" fill="#4895ef" />
  </g>

  <!-- Scanline effect -->
  <line x1="0" y1="0" x2="1200" y2="0" stroke="#4cc9f0" stroke-width="2" class="scanline-anim" opacity="0.3" />

  <!-- Left Content / Text -->
  <g transform="translate(70, 0)">
    <!-- Subtitle Badge -->
    <rect x="0" y="55" width="370" height="34" rx="17" fill="#4cc9f0" fill-opacity="0.15" stroke="#4cc9f0" stroke-opacity="0.4" />
    <text x="18" y="78" class="subtitle">AIRPORT &amp; AVIATION TECH</text>

    <!-- Main Title -->
    <text x="0" y="155" class="title" filter="url(#glow)">Awesome Passenger</text>
    <text x="0" y="215" class="title" fill="url(#accentGrad)">Processing Ecosystem</text>

    <!-- Tags & Tech -->
    <g transform="translate(0, 260)">
      <rect x="0" y="0" width="160" height="32" rx="8" fill="#1c2541" stroke="#3a506b" />
      <text x="14" y="21" class="tag">✈️ Biometrics</text>

      <rect x="175" y="0" width="170" height="32" rx="8" fill="#1c2541" stroke="#3a506b" />
      <text x="189" y="21" class="tag">🛂 Border Gates</text>

      <rect x="360" y="0" width="180" height="32" rx="8" fill="#1c2541" stroke="#3a506b" />
      <text x="374" y="21" class="tag">🧳 Self Bag Drop</text>
    </g>
  </g>

  <!-- Floating Plane Graphic -->
  <g class="plane-anim" transform="translate(680, 80)">
    <path d="M20 40 L60 10 L100 40 L160 30 L110 65 L180 60 L190 75 L110 80 L70 120 L55 115 L75 80 L20 75 Z" fill="#4cc9f0" fill-opacity="0.2" stroke="#4cc9f0" stroke-width="1.5" filter="url(#glow)" />
  </g>
</svg>
